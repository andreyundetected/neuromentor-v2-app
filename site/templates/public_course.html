<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.name }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        .course-info {
            margin: 20px 0;
        }
        .actions {
            text-align: center;
        }
        .actions form {
            display: inline-block;
            margin: 0 10px;
        }
        .button {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ course.name }}</h1>
        <div class="course-info">
            <p><strong>Topic:</strong> {{ course.topic }}</p>
            <p><strong>Создатель:</strong> {{ course.creator }}</p>
            <p><strong>Оценка:</strong> {{ course.rating }}/10</p>
        </div>
        {% if user %}
        <div class="actions">
            <form action="{{ url_for('add_to_library', course_id=course.id) }}" method="POST">
                <button type="submit" class="button">Добавить в библиотеку</button>
            </form>
            <form action="" method="POST">
                <button type="submit" name="action" value="trial_lesson" class="button">Пройти пробный урок</button>
            </form>
        </div>
        {% else %}
        <p>Войдите в аккаунт, чтобы взаимодействовать с курсом.</p>
        {% endif %}
        <div class="actions">
            <a href="{{ url_for('index') }}" class="button">Вернуться на главную</a>
        </div>
    </div>
</body>
</html>
