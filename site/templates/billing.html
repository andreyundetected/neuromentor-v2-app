<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing – NeuroMentor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/billing.css') }}?v=2">
</head>

<body>
  <canvas id="backgroundCanvas"></canvas>

  <!-- ===== Header ===== -->
  <header>
    <a href="/" class="logo">NeuroMentor</a>

    <div class="header-btn lang-btn" id="lang-btn" onclick="toggleLanguageDropdown()">
      <span class="btn-text" id="lang-text">
        {% if session.get('language', 'ru') == 'ru' %} RU {% else %} EN {% endif %}
      </span>
    </div>
    <div class="lang-dropdown" id="lang-dropdown">
      <button onclick="selectLanguage('en')">EN</button>
      <button onclick="selectLanguage('ru')">RU</button>
    </div>

    <a href="https://t.me/NeuroMentor_payment_bot" class="credits" target="_blank">
      {{ user.credits }} {% if session.get('language','ru')=='ru' %}Кредитов{% else %}Credits{% endif %}
    </a>

    <a href="/account" class="account"><div class="account-avatar"></div></a>
  </header>

  <!-- ===== Main ===== -->
  <main class="container">
    <h1>Оплата</h1>

    <!-- План -->
    <h2>Выберите тариф</h2>
    <div class="payment-plan">

      <input type="radio" id="plan-basic" name="plan" value="basic" checked>
      <label for="plan-basic" class="plan-box">
        <div class="plan-title">Базовый</div>
        <div class="plan-lessons">10&nbsp;уроков</div>
        <div class="plan-price">10&nbsp;€</div>
      </label>

      <input type="radio" id="plan-standard" name="plan" value="standard">
      <label for="plan-standard" class="plan-box">
        <div class="plan-title">Стандарт</div>
        <div class="plan-lessons">25&nbsp;уроков</div>
        <div class="plan-price">20&nbsp;€</div>
      </label>

      <input type="radio" id="plan-premium" name="plan" value="premium">
      <label for="plan-premium" class="plan-box">
        <div class="plan-title">Премиум</div>
        <div class="plan-lessons">50&nbsp;уроков</div>
        <div class="plan-price">35&nbsp;€</div>
      </label>
    </div>

    <!-- Способ оплаты -->
    <h2>Способ оплаты</h2>
    <form action="{{ url_for('billing.billing') }}" method="POST" class="billing-form">

      <!-- ===== Банковская карта ===== -->
      <input type="radio" id="method-card" name="method" value="card" checked>
      <label for="method-card" class="method-box card-box">
        <span class="icon">💳</span> Банковская карта
      </label>
      <div class="method-details card-details">
        <div class="input-row">
          <label>Номер карты
            <input type="text" name="card_number" maxlength="19" placeholder="0000 0000 0000 0000" required>
          </label>
          <label>CVV
            <input type="text" name="card_cvv" maxlength="4" placeholder="123" required>
          </label>
        </div>
        <div class="input-row">
          <label>Месяц / Год
            <input type="text" name="card_exp" maxlength="5" placeholder="MM/YY" required>
          </label>
          <label>Имя владельца
            <input type="text" name="card_name" placeholder="CARDHOLDER" required>
          </label>
        </div>
      </div>

      <!-- ===== PayPal ===== -->
      <input type="radio" id="method-paypal" name="method" value="paypal">
      <label for="method-paypal" class="method-box paypal-box">
        <svg viewBox="0 0 24 24" class="paypal-logo"><path d="M5.7 22h3.1l.6-3.8h2.3c3.5 0 6.2-2.3 6.9-6 .6-3.1-.8-5-3.7-5H9.6l-.5 3.3h3.2c.6 0 .9.3.8.9-.3 1.9-1.6 2.8-3.3 2.8H7.5L5.7 22z" fill="#00457C"/></svg>
        PayPal
      </label>
      <div class="method-details paypal-details">
        <label>Email PayPal
          <input type="email" name="paypal_email" placeholder="your@email.com" required>
        </label>
      </div>

      <!-- Кнопка -->
      <button type="submit" class="button-pay">Оплатить</button>
    </form>
  </main>

<script>
  /* dropdown */
  function toggleLanguageDropdown() {
    const d = document.getElementById('lang-dropdown');
    d.style.display = d.style.display === 'flex' ? 'none' : 'flex';
  }
  function selectLanguage(lang){
    fetch(`/set_language/${lang}`,{method:"POST"}).then(()=>location.reload())
  }

  /* динамическая аватарка */
  function hashColor(name){
    const palette=['#FF5733','#33B5FF','#FF33F6','#33FF57','#FFBD33'];
    let h=0;for(let c of name)h=c.charCodeAt(0)+((h<<5)-h);return palette[Math.abs(h)%palette.length];
  }
  const avatar=document.querySelector('.account-avatar');
  const uname="{{ user.username }}";
  avatar.textContent=uname[0].toUpperCase();
  avatar.style.backgroundColor=hashColor(uname);

  /* canvas background (placeholder, можно расширить) */
  const canvas=document.getElementById('backgroundCanvas');
  const ctx=canvas.getContext('2d');function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}window.addEventListener('resize',resize);resize();
</script>
</body>
</html>
