<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Сервер должен подставить актуальное имя пользователя в content -->
  <meta name="username" content="{{username}}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson - NeuroMentor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/default.min.css">
  <style>
    /* Сброс стилей */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background-color: #e9ecef;
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    /* Кастомный скроллбар для Webkit-браузеров */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track {
      background: #e0e0e0;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #d3d3d3;
      border-radius: 10px;
    }

    /* Header: фиксированный, с прозрачным фоном и фиксированной высотой */
    header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px; /* высоту можно настроить по необходимости */
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(10px);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    z-index: 1000;
    }

    /* Логотип привязан к левому верхнему углу (20px от левого и верхнего краёв) */
    .logo {
    position: absolute;
    top: 15px;
    left: 15px;
    font-size: 24px;
    font-weight: bold;
    color: #007bff;
    display: flex;
    align-items: center;
    text-decoration: none;
    transition: transform 0.3s, color 0.3s;
    }
    .logo svg {
    margin-right: 8px;
    transition: transform 0.3s;
    }
    .logo:hover {
    color: #0056b3;
    }
    .logo:hover svg {
    transform: scale(1.1);
    }

    /* Аватарка пользователя привязана к правому верхнему углу (20px от правого и верхнего краёв) */
    .account {
    position: absolute;
    top: 8px;
    right: 15px;
    }
    .account a {
    text-decoration: none;
    }
    .account .account-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-size: 18px;
        font-weight: bold;
        border: 2px solid #007bff;
        transition: transform 0.3s;
    }
    .account .account-avatar:hover {
        transform: scale(1.1);
    }


    /* Основной контейнер с анимацией появления и декоративными элементами */
    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 800px;
      height: 80vh;
      margin: 80px auto 0; /* Отступ сверху для header */
      overflow: hidden;
      padding: 20px;
      animation: fadeInUp 0.5s ease-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Декоративный элемент в правом нижнем углу контейнера */
    .container::after {
      content: "";
      background: url('https://via.placeholder.com/300x200?text=Decorative') no-repeat center/contain;
      opacity: 0.05;
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 150px;
      height: 100px;
      pointer-events: none;
    }

    /* Прогресс-бар */
    .progress-bar-container {
      margin-bottom: 25px; /* Отделяем от чата */
      background: #eee;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
      height: 20px;
    }
    .progress-bar {
      height: 100%;
      background: #007bff;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-text {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      line-height: 20px;
      color: #fff;
      font-weight: bold;
    }

    /* Область сообщений */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 5px;
      margin-bottom: 15px;
    }
    .message {
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      animation: fadeIn 0.3s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Если сообщение пользователя, выравниваем по правому краю */
    .message.user { justify-content: flex-end; }
    .message .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 14px;
      margin-right: 10px;
    }
    .message.user .avatar { margin-left: 10px; margin-right: 0; }
    .message .content {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 10px;
      background: #eee;
      font-size: 14px;
      position: relative;
    }
    .message.user .content { background: #d1ecf1; }

    /* Новая структура сообщения: имя отправителя, разделитель, текст */
    .content .sender-name {
      font-weight: bold;
      margin-bottom: 5px;
    }
    .content .separator {
      font-size: 12px;
      color: #ccc;
      margin-bottom: 5px;
    }
    .content .message-text {
      line-height: 1.4;
    }
    .message .message-text {
        white-space: pre-wrap;
    }

    /* Поле ввода с автоизменением размера */
    textarea {
      width: 100%;
      min-height: 50px;
      max-height: 150px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
      font-size: 14px;
      resize: none;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    textarea:focus {
      border-color: #007bff;
      outline: none;
    }

    /* Кнопка отправки с анимацией */
    .button {
      padding: 10px 20px;
      background-color: #007bff;
      border: none;
      color: #fff;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }
    .button:hover {
      background-color: #0056b3;
      transform: scale(1.02);
    }

    /* Модальное окно завершения генерации курса */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      animation: fadeInOverlay 0.5s ease-out;
    }
    @keyframes fadeInOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .completion-box {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      text-align: center;
      transform: scale(0.8);
      animation: scaleIn 0.3s forwards;
    }
    @keyframes scaleIn {
      to { transform: scale(1); }
    }
    .completion-box h2 {
      color: #007bff;
      margin-bottom: 15px;
    }
    .completion-box p {
      margin-bottom: 20px;
      text-align: left;
    }
    #backgroundCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
        background: linear-gradient(135deg, #f7f9fc, #e9ecef);
    }
    .lesson-title {
        position: relative;   /* для возможности задания z-index */
        z-index: 1;           /* чтобы быть выше фона прогресс-бара, если тот находится в том же контейнере */
        font-size: 32px;      /* увеличенный размер шрифта */
        font-weight: bold;
        color: #3a6ad6;
        text-align: center;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #3a6ad6;
    }
    .mode-toggle {
      position: fixed;          /* Фиксированное позиционирование */
      top: -10px;                /* Вертикально на том же уровне, что и текст NeuroMentor в header */
      left: 50%;                /* Горизонтально по центру экрана */
      transform: translateX(-50%);  /* Центрирование по оси X */
      z-index: 1100;            /* Выше, чем header (header имеет z-index: 1000) */
      display: inline-flex;
      border: 2px solid #007bff;
      border-radius: 30px;
      overflow: hidden;
      margin: 20px 0;
    }
    .mode-button {
      flex: 1;
      padding: 10px 20px;
      background: #fff;
      border: none;
      font-size: 16px;
      color: #007bff;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
    }

    .mode-button.active {
      background-color: #007bff;
      color: #fff;
    }

    .mode-button:not(.active):hover {
      background-color: #e6f0ff;
    }



  </style>
</head>
<body>
  <canvas id="backgroundCanvas"></canvas>
  <header>
    <a href="/" class="logo">NeuroMentor</a>
    <div class="account">
      <!-- Аватарка в header обёрнута в ссылку на страницу аккаунта -->
      <a href="/account" title="Профиль">
        <div class="avatar account-avatar"></div>
      </a>
    </div>
  </header>
  <!-- Переключатель режима урока -->
  <div class="mode-toggle">
    <button class="mode-button active" onclick="window.location.href='/course_select/{{ user.id }}/{{ course_idx }}/lesson_call'">Chat</button>
    <button class="mode-button" onclick="window.location.href='/course_select/{{ user.id }}/{{ course_idx }}/lesson_call'">Call</button>
  </div>
  
  <div class="container">
    <h1 class="lesson-title">{{ lesson_title }}</h1>
    <!-- Прогресс-бар -->
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
      <span class="progress-text">{{ progress or 0 }}%</span>
    </div>

    <!-- Область сообщений -->
    <div class="messages" id="messages">
      <div class="message teacher">
        <div class="avatar">
          <!-- Аватарка учителя -->
          <img src="https://img.icons8.com/color/48/000000/teacher.png" alt="Teacher" style="width:100%;height:100%;border-radius:50%;">
        </div>
        <div class="content">
          <div class="sender-name">Teacher</div>
          <div class="message-text">Hi! I'm a teacher. Ready to start class?</div>
        </div>
      </div>
    </div>
    <!-- Форма ввода сообщения -->
    <form id="lesson-form" action="/course_select/{{ user.id }}/{{ course_idx }}/lesson_chat" method="POST">
        <textarea name="conversation" id="conversation" placeholder="Write your message here"></textarea>
        <button type="submit" class="button">Send</button>
    </form>
  </div>

  <div class="overlay" id="overlay">
    <div class="completion-box">
      <h2>Lesson</h2>
      <p id="user-info">The lesson is over</p>
      <button class="button" onclick="window.location.href='/library'">Continue</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script>
    const canvas = document.getElementById("backgroundCanvas");
    const ctx = canvas.getContext("2d");
  
    let shapes = [];
    const shapeCount = 120;
  
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      createShapes();
    }
  
    function createShapes() {
      shapes = [];
      for (let i = 0; i < shapeCount; i++) {
        const size = Math.random() * 30 + 20;
        shapes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: size,
          type: ["triangle0", "triangle1", "triangle2", "triangle3", "square", "circle"][Math.floor(Math.random() * 6)],
          speedX: (Math.random() - 0.5) * 1,
          speedY: (Math.random() - 0.5) * 1
        });
      }
    }
  
    function drawShapes() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(180, 180, 180, 0.5)";
      ctx.lineWidth = 1.5;
  
      for (let shape of shapes) {
        ctx.beginPath();
        if (shape.type === "triangle0") {
          ctx.moveTo(shape.x, shape.y);
          ctx.lineTo(shape.x + shape.size, shape.y);
          ctx.lineTo(shape.x, shape.y + shape.size);
        } else if (shape.type === "triangle1") {
          ctx.moveTo(shape.x + shape.size, shape.y);
          ctx.lineTo(shape.x, shape.y);
          ctx.lineTo(shape.x + shape.size, shape.y + shape.size);
        } else if (shape.type === "triangle2") {
          ctx.moveTo(shape.x, shape.y + shape.size);
          ctx.lineTo(shape.x, shape.y);
          ctx.lineTo(shape.x + shape.size, shape.y + shape.size);
        } else if (shape.type === "triangle3") {
          ctx.moveTo(shape.x + shape.size, shape.y + shape.size);
          ctx.lineTo(shape.x + shape.size, shape.y);
          ctx.lineTo(shape.x, shape.y + shape.size);
        } else if (shape.type === "square") {
          ctx.rect(shape.x, shape.y, shape.size, shape.size);
        } else if (shape.type === "circle") {
          ctx.arc(shape.x, shape.y, shape.size / 2, 0, Math.PI * 2);
        }
        ctx.closePath();
        ctx.stroke();
      }
    }
  
    function updateShapes() {
      for (let shape of shapes) {
        shape.x += shape.speedX;
        shape.y += shape.speedY;
  
        if (shape.x < 0 || shape.x > canvas.width) shape.speedX *= -1;
        if (shape.y < 0 || shape.y > canvas.height) shape.speedY *= -1;
      }
    }
  
    function animate() {
      updateShapes();
      drawShapes();
      requestAnimationFrame(animate);
    }
  
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    animate();
  </script>
  
  <script>
    // Извлекаем имя пользователя из мета-тега, переданного сервером
    const username = document.querySelector('meta[name="username"]').getAttribute('content') || 'User';

    // Функция генерации цвета для аватарки на основе имени
    function getUserAvatarColor(name) {
      const colors = ['#FF5733', '#33B5FF', '#FF33F6', '#33FF57', '#FFBD33'];
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % colors.length;
      return colors[index];
    }
    const userAvatarColor = getUserAvatarColor(username);

    // Устанавливаем аватарку в header
    const accountAvatar = document.querySelector('.account-avatar');
    accountAvatar.style.backgroundColor = userAvatarColor;
    accountAvatar.textContent = username.charAt(0).toUpperCase();

    const form = document.getElementById('lesson-form');
    const messages = document.getElementById('messages');
    const textarea = document.getElementById('conversation');
    const overlay = document.getElementById('overlay');
    const userInfoElement = document.getElementById('user-info');

    // Создаём аватарку пользователя для сообщений (обёрнутую в ссылку на /account)
    function createUserAvatar() {
      const link = document.createElement('a');
      link.href = '/account';
      link.title = 'Профиль';
      const avatar = document.createElement('div');
      avatar.classList.add('avatar');
      avatar.style.backgroundColor = userAvatarColor;
      avatar.textContent = username.charAt(0).toUpperCase();
      link.appendChild(avatar);
      return link;
    }

    // Создаём аватарку учителя для сообщений
    function createTeacherAvatar() {
      const avatar = document.createElement('div');
      avatar.classList.add('avatar');
      avatar.innerHTML = '<img src="https://img.icons8.com/color/48/000000/teacher.png" alt="Teacher" style="width:100%;height:100%;border-radius:50%;">';
      return avatar;
    }

    // Функция добавления нового сообщения с обновлённой структурой
    function addMessage(sender, messageText) {
      const messageElem = document.createElement('div');
      messageElem.classList.add('message', sender);

      let avatar;
      let senderLabel = '';
      if (sender === 'user') {
        avatar = createUserAvatar();
        senderLabel = username;
      } else if (sender === 'teacher') {
        avatar = createTeacherAvatar();
        senderLabel = 'Teacher';
      }

      const content = document.createElement('div');
      content.classList.add('content');

      const senderHeader = document.createElement('div');
      senderHeader.classList.add('sender-name');
      senderHeader.textContent = senderLabel;

      const separator = document.createElement('div');
      separator.classList.add('separator');

      const messageBody = document.createElement('div');
      messageBody.classList.add('message-text');
      messageBody.textContent = messageText;

      content.appendChild(senderHeader);
      content.appendChild(separator);
      content.appendChild(messageBody);

      if (sender === 'user') {
        messageElem.appendChild(content);
        messageElem.appendChild(avatar);
      } else {
        messageElem.appendChild(avatar);
        messageElem.appendChild(content);
      }
      messages.appendChild(messageElem);
      messages.scrollTop = messages.scrollHeight;
    }
    function createAudioFromBase64(base64) {
        const binaryString = atob(base64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        const blob = new Blob([bytes], { type: 'audio/mp3' });
        return URL.createObjectURL(blob);
        }
    function addAudioMessage(sender, audioUrl) {
        const messageElem = document.createElement('div');
        messageElem.classList.add('message', sender);

        const avatar = sender === 'teacher' ? createTeacherAvatar() : createUserAvatar();
        const content = document.createElement('div');
        content.classList.add('content');

        const senderHeader = document.createElement('div');
        senderHeader.classList.add('sender-name');
        senderHeader.textContent = sender === 'teacher' ? 'Teacher' : username;

        const audioElem = document.createElement('audio');
        audioElem.controls = true;
        audioElem.src = audioUrl;

        content.appendChild(senderHeader);
        content.appendChild(audioElem);

        if (sender === 'user') {
            messageElem.appendChild(content);
            messageElem.appendChild(avatar);
        } else {
            messageElem.appendChild(avatar);
            messageElem.appendChild(content);
        }

        messages.appendChild(messageElem);
        messages.scrollTop = messages.scrollHeight;
        }

    // Обработка отправки формы
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userMessage = textarea.value.trim();
      if (!userMessage) return;

      addMessage('user', userMessage);
      textarea.value = '';
      textarea.style.height = 'auto';

      const formData = new FormData();
      formData.append('conversation', userMessage);

      try {
        const response = await fetch(form.action, {
            method: 'POST',
            body: formData,
        });
        const data = await response.json();

        addMessage('teacher', data.response);
        if (data.audio_response) {
            const audioUrl = createAudioFromBase64(data.audio_response);
            addAudioMessage('teacher', audioUrl);
        }

        // Обновление прогресс-бара, если API возвращает progress (число от 0 до 100)
        if (data.progress !== undefined) {
          const progressValue = parseFloat(data.progress);
          document.querySelector('.progress-bar').style.width = progressValue + '%';
          document.querySelector('.progress-text').textContent = progressValue.toFixed(0) + '%';
        }

        // Если создание курса завершено
        if (data.status === '<END>') {
          textarea.disabled = true;
          form.querySelector('.button').disabled = true;
          const userInfo = data.user_info || {};
          let userInfoHtml = '<ul>';
          userInfoHtml += '</ul>';
          userInfoElement.innerHTML += userInfoHtml;
          overlay.style.display = 'flex';
        }
      } catch (error) {
        console.error('Ошибка отправки:', error);
      }
    });

    // Отправка формы по нажатию Enter (без Shift)
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
