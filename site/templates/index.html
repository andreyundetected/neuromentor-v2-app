<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            color: #007bff;
        }
        .logo:hover {
            color: #0056b3;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .course-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
        }
        .course-card img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .course-card h2 {
            font-size: 18px;
            margin: 10px 0;
        }
        .course-card p {
            font-size: 14px;
            color: #666;
        }
        .course-card a {
            display: block;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .course-card a:hover {
            background-color: #0056b3;
        }
        .navigation {
            text-align: center;
            margin-top: 20px;
        }
        .navigation .button {
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            margin: 5px;
        }
        .navigation .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="{{ url_for('dashboard.library') }}" class="logo">NeuroMentor</a>
        </header>
        <h1>Добро пожаловать на платформу!</h1>
        <div class="course-grid">
            {% for course in public_courses %}
            <div class="course-card">
                <img src="/static/course_placeholder.jpg" alt="Изображение курса">
                <h2>{{ course.name }}</h2>
                <p>Создатель: {{ course.creator }}</p>
                <p>Оценка: {{ course.rating }}/10</p>
                <a href="{{ url_for('public_course_view', course_id=course.id) }}" class="button">Посмотреть курс</a>
            </div>
            {% endfor %}
        </div>
        <div class="navigation">
            {% if user %}
            <a href="{{ url_for('dashboard.library') }}" class="button">Перейти в библиотеку</a>
            {% else %}
            <a href="{{ url_for('auth.register') }}" class="button">Register</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
