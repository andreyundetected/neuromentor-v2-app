<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e9ecef;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-size: 14px;
            color: #555;
        }
        input[type="text"],
        input[type="password"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        .login-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #007bff;
            text-decoration: none;
        }
        .login-link:hover {
            color: #0056b3;
        }
        #backgroundCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(135deg, #f7f9fc, #e9ecef);
        }
    </style>
</head>
<body>
    <canvas id="backgroundCanvas"></canvas>
    <div class="container">
        <h1>Registration</h1>
        <form action="/register" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Register</button>
        </form>
        
        <!-- Ссылка на вход -->
        <a href="/login" class="login-link">Already have an account? Login</a>
    </div>
    <script>
        const canvas = document.getElementById("backgroundCanvas");
        const ctx = canvas.getContext("2d");
      
        let shapes = [];
        const shapeCount = 120;
      
        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          createShapes();
        }
      
        function createShapes() {
          shapes = [];
          for (let i = 0; i < shapeCount; i++) {
            const size = Math.random() * 30 + 20;
            shapes.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              size: size,
              type: ["triangle0", "triangle1", "triangle2", "triangle3", "square", "circle"][Math.floor(Math.random() * 6)],
              speedX: (Math.random() - 0.5) * 1,
              speedY: (Math.random() - 0.5) * 1
            });
          }
        }
      
        function drawShapes() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = "rgba(180, 180, 180, 0.5)";
          ctx.lineWidth = 1.5;
      
          for (let shape of shapes) {
            ctx.beginPath();
            if (shape.type === "triangle0") {
              ctx.moveTo(shape.x, shape.y);
              ctx.lineTo(shape.x + shape.size, shape.y);
              ctx.lineTo(shape.x, shape.y + shape.size);
            } else if (shape.type === "triangle1") {
              ctx.moveTo(shape.x + shape.size, shape.y);
              ctx.lineTo(shape.x, shape.y);
              ctx.lineTo(shape.x + shape.size, shape.y + shape.size);
            } else if (shape.type === "triangle2") {
              ctx.moveTo(shape.x, shape.y + shape.size);
              ctx.lineTo(shape.x, shape.y);
              ctx.lineTo(shape.x + shape.size, shape.y + shape.size);
            } else if (shape.type === "triangle3") {
              ctx.moveTo(shape.x + shape.size, shape.y + shape.size);
              ctx.lineTo(shape.x + shape.size, shape.y);
              ctx.lineTo(shape.x, shape.y + shape.size);
            } else if (shape.type === "square") {
              ctx.rect(shape.x, shape.y, shape.size, shape.size);
            } else if (shape.type === "circle") {
              ctx.arc(shape.x, shape.y, shape.size / 2, 0, Math.PI * 2);
            }
            ctx.closePath();
            ctx.stroke();
          }
        }
      
        function updateShapes() {
          for (let shape of shapes) {
            shape.x += shape.speedX;
            shape.y += shape.speedY;
      
            if (shape.x < 0 || shape.x > canvas.width) shape.speedX *= -1;
            if (shape.y < 0 || shape.y > canvas.height) shape.speedY *= -1;
          }
        }
      
        function animate() {
          updateShapes();
          drawShapes();
          requestAnimationFrame(animate);
        }
      
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
        animate();
      </script>
</body>
</html>
