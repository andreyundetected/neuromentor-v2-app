<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course settings курса</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #fff;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            color: #007bff;
        }
        .logo:hover {
            color: #0056b3;
        }
        .back-button {
            background-color: #007bff;
            color: #fff;
            padding: 5px 10px;
            text-decoration: none;
            font-size: 14px;
            border-radius: 5px;
        }
        .back-button:hover {
            background-color: #0056b3;
        }
        .container {
            display: flex;
            gap: 20px;
            margin: 80px 20px 20px;
            flex-grow: 1;
        }
        .settings-panel, .course-structure {
            flex: 1;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            overflow-y: auto;
        }
        .settings-panel h2, .course-structure h2 {
            margin-top: 0;
        }
        .settings-panel label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }
        .settings-panel input, .settings-panel select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .topic {
            margin-bottom: 10px;
        }
        .topic h3 {
            margin: 0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topic ul {
            margin: 10px 0 0;
            padding: 0;
            list-style: none;
            display: none;
        }
        .topic ul li {
            padding: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topic ul li .description {
            font-size: 12px;
            color: #666;
            margin-left: 20px;
        }
        .nearest-lesson {
            margin-top: 20px;
            padding: 10px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .nearest-lesson h3 {
            margin: 0 0 10px;
        }
        .nearest-lesson select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <!-- Шторка -->
    <header>
        <a href="{{ url_for('library') }}" class="logo">NeuroMentor</a>
        <a href="{{ url_for('course_select', user_id=user.id, course_idx=course_idx) }}" class="back-button">Back</a>
    </header>

    <!-- Основной контент -->
    <div class="container">
        <!-- Левая панель: Общие настройки -->
        <div class="settings-panel">
            <h2>Общие настройки</h2>
            <form id="general-settings-form" method="POST" action="/update_course_info/{{ user.id }}/{{ course_idx }}">
                <label for="course-name">Название курса:</label>
                <input type="text" id="course-name" name="course_name" value="{{ course_info['3_name'] or '' }}">

                <label for="learning-format">Формат обучения:</label>
                <select id="learning-format" name="learning_format">
                    <option value="self" {% if course_info['learning_format'] == 'self' %}selected{% endif %}>Самостоятельное</option>
                    <option value="group" {% if course_info['learning_format'] == 'group' %}selected{% endif %}>Групповое</option>
                </select>

                <label for="lecture-type">Тип лекции:</label>
                <select id="lecture-type" name="lecture_type">
                    <option value="video" {% if course_info['lecture_type'] == 'video' %}selected{% endif %}>Видео</option>
                    <option value="text" {% if course_info['lecture_type'] == 'text' %}selected{% endif %}>Текст</option>
                    <option value="audio" {% if course_info['lecture_type'] == 'audio' %}selected{% endif %}>Аудио</option>
                </select>

                <button type="submit" class="button">Сохранить изменения</button>
            </form>
        </div>

        <!-- Правая панель: Структура курса -->
        <div class="course-structure">
            <h2>Структура курса</h2>
            {% for topic in course_info['4_structure'] %}
            <div class="topic">
                <h3>
                    {{ topic['0_topic'] }}
                    <input type="checkbox" {% if topic['completed'] %}checked{% endif %} disabled>
                </h3>
                <ul>
                    {% for lesson in topic['3_lessons'] %}
                    <li>
                        {{ lesson['name'] }}
                        <input type="checkbox" {% if lesson['completed'] %}checked{% endif %} disabled>
                        <span class="description">{{ lesson['description'] or '' }}</span>
                    </li>
                    {% endfor %}
                </ul>
            </div>
            {% endfor %}
            <div class="nearest-lesson">
                <h3>Ближайший урок</h3>
                <select>
                    {% for topic in course_info['4_structure'] %}
                    {% for lesson in topic['3_lessons'] %}
                    <option value="{{ lesson['name'] }}" {% if lesson['name'] == nearest_lesson %}selected{% endif %}>
                        {{ lesson['name'] }}
                    </option>
                    {% endfor %}
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.topic h3').forEach(topicHeader => {
            topicHeader.addEventListener('click', () => {
                const topic = topicHeader.parentElement;
                const lessonList = topic.querySelector('ul');
                lessonList.style.display = lessonList.style.display === 'block' ? 'none' : 'block';
            });
        });
    </script>
</body>
</html>
